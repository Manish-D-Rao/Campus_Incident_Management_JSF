<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Campus Cyber Incident Management</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/api.js" defer></script>
</head>
<body>
    <div class="register-wrap">
        <h2>Register</h2>
        <div id="alert"></div>
        <form id="register-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="email@college.edu" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="role">
                    <option value="STUDENT">Student</option>
                    <option value="STAFF">Staff</option>
                    <option value="ADMIN">Admin</option>
                    <option value="OFFICER">Security Officer</option>
                </select>
            </div>
            <div class="form-group">
                <label>Department</label>
                <input type="text" id="department" placeholder="Computer Science">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Register</button>
        </form>
        <p style="text-align:center; margin-top:16px; font-size:14px; color:#64748b;">
            Already have an account? <a href="/login.html" style="color:#2563eb">Login here</a>
        </p>
    </div>
    <script>
    document.getElementById('register-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('alert');
        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value,
            department: document.getElementById('department').value
        };
        try {
            const res = await apiRequest('/auth/register', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            if (res.status === 200) {
                showAlert('alert', 'Registration successful. Please login.', 'success');
                setTimeout(() => { window.location.href = '/login.html'; }, 1500);
            } else {
                showAlert('alert', friendlyError(res.status, res.data ? res.data.error : null), 'error');
            }
        } catch (err) {
            showAlert('alert', 'Unable to connect. Please check your internet and try again.', 'error');
        }
    });
    </script>
</body>
</html>
