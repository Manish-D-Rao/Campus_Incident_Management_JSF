<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Campus Cyber Incident Management</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/api.js" defer></script>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>Campus Cyber Incident Management</h1>
            <div class="nav">
                <span id="admin-user-info"></span>
                <a href="#" id="logout-btn" class="btn btn-danger" style="padding:6px 12px">Logout</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="alert"></div>

        <div class="dashboard-grid">
            <div class="stat-card">
                <h3>Total Incidents</h3>
                <div class="value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <h3>Open</h3>
                <div class="value" id="stat-open">0</div>
            </div>
            <div class="stat-card">
                <h3>In Progress</h3>
                <div class="value" id="stat-inprogress">0</div>
            </div>
            <div class="stat-card">
                <h3>Resolved</h3>
                <div class="value" id="stat-resolved">0</div>
            </div>
            <div class="stat-card">
                <h3>Closed</h3>
                <div class="value" id="stat-closed">0</div>
            </div>
        </div>

        <div class="card">
            <h2>All Incidents</h2>
            <table class="table" id="incident-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Severity</th>
                        <th>Status</th>
                        <th>Reported By</th>
                        <th>Assigned To</th>
                        <th>Reported At</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="incident-table-body">
                </tbody>
            </table>
            <div id="empty-state" class="empty-state" style="display:none;">No incidents found.</div>
        </div>
    </div>

    <script>
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login.html'; }

    const user = JSON.parse(localStorage.getItem('user') || '{}');
    document.getElementById('admin-user-info').textContent = (user.name || user.email) + ' (' + user.role + ')';
    document.getElementById('logout-btn')?.addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = '/login.html';
    });

    async function loadIncidents() {
        const alert = document.getElementById('alert');
        const empty = document.getElementById('empty-state');
        const tbody = document.getElementById('incident-table-body');
        try {
            const res = await apiRequest('/incidents');
            if (res.status < 200 || res.status >= 300) {
                throw new Error('Incident request failed with status ' + res.status);
            }
            const incidents = res.status === 204 ? [] : res.data;
            if (!Array.isArray(incidents)) {
                throw new Error('Incident response was not a list');
            }

            alert.innerHTML = '';
            tbody.innerHTML = '';
            empty.style.display = 'none';

            document.getElementById('stat-total').textContent = incidents.length;
            document.getElementById('stat-open').textContent = incidents.filter(i => i.status === 'OPEN').length;
            document.getElementById('stat-inprogress').textContent = incidents.filter(i => i.status === 'IN_PROGRESS').length;
            document.getElementById('stat-resolved').textContent = incidents.filter(i => i.status === 'RESOLVED').length;
            document.getElementById('stat-closed').textContent = incidents.filter(i => i.status === 'CLOSED').length;

            if (incidents.length === 0) {
                empty.style.display = 'block';
            } else {
                empty.style.display = 'none';

                incidents.forEach(inc => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${inc.id}</td>
                        <td>${escapeHtml(inc.title)}</td>
                        <td><span class="badge badge-${inc.severity.toLowerCase()}">${inc.severity}</span></td>
                        <td><span class="badge badge-${inc.status.toLowerCase().replace(' ', '_')}">${inc.status}</span></td>
                        <td>${inc.reportedBy ? escapeHtml(inc.reportedBy.name || inc.reportedBy.email) : '-'}</td>
                        <td>${inc.assignedTo ? escapeHtml(inc.assignedTo.name || inc.assignedTo.email) : '<span style="color:#94a3b8">-</span>'}</td>
                        <td>${inc.reportedAt ? new Date(inc.reportedAt).toLocaleString() : '-'}</td>
                        <td><a href="/incident-detail.html?id=${inc.id}" class="btn btn-sm btn-primary">View</a></td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        } catch (err) {
            empty.style.display = 'none';
            alert.innerHTML = '<div class="alert alert-error">Unable to load incidents. Please try again.</div>';
        }
    }

    function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
    function showAlert(containerId, message, type) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '<div class="alert alert-' + type + '">' + escapeHtml(message) + '</div>';
        setTimeout(() => { container.innerHTML = ''; }, 5000);
    }

    loadIncidents();
    </script>
</body>
</html>
